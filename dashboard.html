<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracker - Dashboard</title>

    <!-- Tailwind CSS + DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.2.0/css/fontawesome.css"
    />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.2.0/css/sharp-light.css"
    />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.2.0/css/chisel-regular.css"
    />
  </head>
  <body class="bg-[#F8FAFC]">
    <header>
      <nav class="shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
          <div class="flex items-center gap-3 p-4">
            <div>
              <img
                src="./assets/github-logo.png"
                alt="Github Logo"
                class="w-10 h-10 mx-auto"
              />
            </div>
            <div>
              <h1 class="text-2xl font-bold text-gray-700">
                Github Issue Tracker
              </h1>
            </div>
          </div>
          <div class="flex input-bordered items-center gap-4 p-4">
            <div class="flex flex-1 input items-center gap-2">
              <i class="fa-solid text-gray-500 fa-magnifying-glass"></i>
              <input
                type="text"
                placeholder="Search issues..."
                class="w-full max-w-xs"
              />
            </div>

            <div>
              <button class="btn btn-primary flex-1 ml-2">
                <i class="fa-solid fa-plus ml-2"></i> New Issue
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <!-- Issue Status Filters -->
      <section class="pt-12">
        <div
          class="flex items-center gap-4 p-5 max-w-7xl mx-auto bg-white rounded-lg shadow-sm"
        >
          <button class="btn btn-outline">All</button>
          <button class="btn btn-outline">Open</button>
          <button class="btn btn-outline">Closed</button>
        </div>
      </section>

      <!-- Issues List -->
      <section class="py-8">
        <div class="max-w-7xl mx-auto">
          <div
            class="flex items-center justify-between p-5 bg-white rounded-tl-lg rounded-tr-lg shadow-sm relative z-10"
          >
            <div class="flex items-center gap-4">
              <div
                class="w-14 h-14 bg-purple-200 rounded-full flex items-center justify-center"
              >
                <img
                  src="./assets/Aperture.png"
                  alt="Issue Avatar"
                  class="w-12 h-12 rounded-full"
                />
              </div>
              <div>
                <h1 class="text-2xl font-bold"><span>50</span> Issues</h1>
                <p class="text-gray-500">
                  Track and manage your project issues
                </p>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <p class="flex items-center gap-2">
                <span
                  class="w-3 h-3 inline-block rounded-full bg-emerald-600"
                ></span>
                <span>Open</span>
              </p>
              <p class="flex items-center gap-2">
                <span
                  class="w-3 h-3 inline-block rounded-full bg-purple-600"
                ></span>
                <span>Closed</span>
              </p>
            </div>
          </div>
          <!-- Issue Cards container -->
          <div
            class="bg-[#FBFBFB] rounded-bl-lg rounded-br-lg shadow-sm p-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"
          >
            <!-- Issue Card -->
            <div
              class="border-t-4 rounded-md border-emerald-600 bg-white shadow-sm"
            >
              <div class="border-b-2 p-5 border-gray-300">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3 py-1">
                    <img
                      src="./assets/Open-Status.png"
                      alt="Open Status"
                      class="w-6 h-6 rounded-full"
                    />
                  </div>
                  <div>
                    <span
                      class="py-1 px-5 rounded-full bg-red-50 text-xs text-red-500 uppercase"
                      >High</span
                    >
                  </div>
                </div>
                <div class="mt-2 space-y-2">
                  <h2 class="text-sm">Issue Title</h2>
                  <p class="text-gray-500 text-xs mt-1">
                    This is a brief description of the issue.
                  </p>
                  <div class="flex items-center gap-3">
                    <button
                      class="px-2 p-[1px] rounded-full bg-red-50 text-xs text-red-500 border border-red-500 uppercase"
                    >
                      <i class="fa-chisel fa-regular fa-bug"></i>
                      Bug
                    </button>
                    <button
                      class="px-2 py-[1px] rounded-full bg-yellow-50 text-xs text-amber-600 border border-yellow-500 uppercase"
                    >
                      <i class="fa-sharp fa-light fa-circle-currency"></i>
                      help wanted
                    </button>
                  </div>
                </div>
              </div>
              <div class="p-5 text-gray-400 space-y-3">
                <p class="text-xs">#1by john_doe</p>
                <p class="text-xs">1/15/2024</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
