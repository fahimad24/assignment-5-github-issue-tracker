<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracker - Dashboard</title>

    <!-- Tailwind CSS + DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.2.0/css/fontawesome.css"
    />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.2.0/css/light.css"
    />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.2.0/css/sharp-light.css"
    />
    <link
      rel="stylesheet"
      href="https://site-assets.fontawesome.com/releases/v7.2.0/css/chisel-regular.css"
    />
  </head>
  <body class="bg-[#F8FAFC]">
    <header>
      <nav class="shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
          <div class="flex items-center gap-3 p-4">
            <div>
              <img
                src="./assets/github-logo.png"
                alt="Github Logo"
                class="w-10 h-10 mx-auto"
              />
            </div>
            <div>
              <h1 class="text-2xl font-bold text-gray-700">
                Github Issue Tracker
              </h1>
            </div>
          </div>
          <div class="flex input-bordered items-center gap-4 p-4">
            <div class="flex flex-1 input items-center gap-2">
              <i class="fa-solid text-gray-500 fa-magnifying-glass"></i>
              <input
                type="text"
                placeholder="Search issues..."
                class="w-full max-w-xs"
              />
            </div>

            <div>
              <button class="btn btn-primary flex-1 ml-2">
                <i class="fa-solid fa-plus ml-2"></i> New Issue
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <!-- Issue Status Filters -->
      <section class="pt-12">
        <div
          id="filter-btns-container"
          class="flex items-center gap-4 p-5 max-w-6xl mx-auto bg-white rounded-lg shadow-sm"
        >
          <button onclick="dataLoader('all')" class="btn btn-outline">
            All
          </button>
          <button onclick="dataLoader('open')" class="btn btn-outline">
            Open
          </button>
          <button onclick="dataLoader('closed')" class="btn btn-outline">
            Closed
          </button>
        </div>
      </section>

      <!-- Issues List -->
      <section class="py-8">
        <div class="max-w-6xl mx-auto">
          <div
            class="flex items-center justify-between p-5 bg-white rounded-tl-lg rounded-tr-lg shadow-sm relative z-10"
          >
            <div class="flex items-center gap-4">
              <div
                class="w-16 h-16 bg-purple-200 rounded-full flex items-center justify-center"
              >
                <img
                  src="./assets/Aperture.png"
                  alt="Issue Avatar"
                  class="w-12 h-12 rounded-full"
                />
              </div>
              <div>
                <h1 class="text-2xl font-bold">
                  <span id="issuses-langth">0</span> Issues
                </h1>
                <p class="text-gray-500">
                  Track and manage your project issues
                </p>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <p class="flex items-center gap-2">
                <span
                  class="w-3 h-3 inline-block rounded-full bg-emerald-600"
                ></span>
                <span>Open</span>
              </p>
              <p class="flex items-center gap-2">
                <span
                  class="w-3 h-3 inline-block rounded-full bg-purple-600"
                ></span>
                <span>Closed</span>
              </p>
            </div>
          </div>
          <!-- Issue Cards container -->
          <div
            id="issue-cards-container"
            class="bg-[#FBFBFB] rounded-bl-lg rounded-br-lg shadow-sm p-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
          >
            <!-- Issue Card -->
          </div>
        </div>
      </section>
    </main>

    <!-- dashboard scripts -->
    <script src="./scripts/utils/elementsget.js"></script>
    <script src="./scripts/dashboard.js"></script>
  </body>
</html>
